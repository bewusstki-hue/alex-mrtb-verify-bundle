name: Test verify Action (temporary)

on:
  workflow_dispatch:
    inputs:
      bundle_json:
        description: "Full evidence bundle JSON to test the composite action against"
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run local composite action
        id: verify
        uses: ./.github/actions/verify
        with:
          bundle-json: ${{ inputs.bundle_json }}
          ref: ${{ github.ref_name }}
      - name: Print outputs
        run: |
          echo "outcome=${{ steps.verify.outputs.outcome }}"
          echo "reason=${{ steps.verify.outputs.reason }}"
